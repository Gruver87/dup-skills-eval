name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Pytest
        run: python -m pytest -q
      - name: Eval good fixture
        run: python -m skills_eval tests/fixtures/good_pack --no-report
      - name: Eval bad fixture (expect fail)
        run: |
          if python -m skills_eval tests/fixtures/bad_pack --no-report; then
            echo "expected FAIL on bad_pack" >&2
            exit 1
          fi
          echo "bad_pack correctly failed"
